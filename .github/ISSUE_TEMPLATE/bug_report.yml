name: Relatar um bug
description: Informe um problema reproduzível na extensão.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. Não publique API keys, áudios, transcrições ou dados pessoais.

  - type: input
    id: version
    attributes:
      label: Versão da extensão
      placeholder: '0.2.0'
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Sistema operacional
      options:
        - macOS
        - Windows
        - Linux
        - Outro
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Versão do Chrome
      description: Disponível em chrome://version.
      placeholder: 'Ex.: 140.0.7339.0'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o que você esperava.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra uma conversa...
        2. Clique em...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Remova credenciais, conteúdo de mensagens e outros dados pessoais.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Procurei por issues semelhantes.
          required: true
        - label: Removi credenciais e dados pessoais deste relato.
          required: true
        - label: Este relato não descreve uma vulnerabilidade de segurança.
          required: true
