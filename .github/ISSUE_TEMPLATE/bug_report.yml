name: Report a bug
description: Report a reproducible issue in the extension.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your report. Do not publish API keys, audio, transcripts, or personal data.

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: '0.2.0'
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Available at chrome://version.
      placeholder: 'E.g.: 140.0.7339.0'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a conversation...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, message content, and other personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for similar issues.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
