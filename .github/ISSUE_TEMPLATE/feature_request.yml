name: Suggest an improvement
description: Propose a feature or improvement for the project.
title: '[Enhancement]: '
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the project.

  - type: textarea
    id: problem
    attributes:
      label: What problem does the proposal solve?
      description: Explain the need before describing the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you expect the extension to behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List other approaches or workarounds, if any.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for similar proposals.
          required: true
        - label: The proposal preserves privacy or explains any new data processing.
          required: true
